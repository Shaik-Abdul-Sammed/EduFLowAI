name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd eduflow-backend && npm ci
      - run: cd eduflow-backend && NODE_ENV=test DB_MODE=memory node --test tests/unit/*.js tests/integration/*.js

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd eduflow-core/web && npm ci
      - run: cd eduflow-core/web && npm test -- --runInBand
      - run: cd eduflow-core/web && npm run build
