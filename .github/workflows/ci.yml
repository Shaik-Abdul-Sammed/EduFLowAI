name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eduflow_ai_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies (frontend)
        run: npm --prefix eduflow-core/web install

      - name: Install dependencies (backend)
        run: npm --prefix eduflow-backend install

      - name: Run frontend tests (Jest & a11y)
        run: CI=true npm --prefix eduflow-core/web test -- --coverage --runInBand

      - name: Run backend tests (Node --test)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eduflow_ai_test
        run: npm --prefix eduflow-backend test

      - name: Install Playwright Browsers
        run: npx --prefix eduflow-core/web playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm --prefix eduflow-core/web run test:e2e

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./eduflow-core/web/coverage/coverage-final.json
          flags: frontend
          name: codecov-frontend

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Build frontend
        run: npm --prefix eduflow-core/web install && npm --prefix eduflow-core/web run build

      - name: Build backend
        run: npm --prefix eduflow-backend install

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build
          path: eduflow-core/web/dist

  deploy:
    needs: [test, build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v3

      - name: Deploy to production
        run: |
          echo "Deploying to production..."
