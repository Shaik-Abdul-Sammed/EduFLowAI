# ==============================================================================
# EduFlow AI OS — Complete Render Blueprint (render.yaml)
# Single git-push deployment: Express Backend + React Vite SPA + Managed PostgreSQL
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. EduFlow Backend Web Service (Node.js Express API)
  # Production API server powering AI Officers, CRM leads, PDF export, and auth
  # ----------------------------------------------------------------------------
  - type: web
    name: eduflow-backend
    runtime: node
    plan: starter
    region: singapore
    rootDir: eduflow-backend
    branch: main
    buildCommand: npm ci
    preDeployCommand: bash scripts/migrate-and-seed.sh
    startCommand: node src/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Application Environment
      - key: NODE_ENV
        value: production
      - key: DB_MODE
        value: postgres
      - key: LOG_LEVEL
        value: info

      # Database Connection (auto-linked from eduflow-postgres database below)
      - key: DATABASE_URL
        fromDatabase:
          name: eduflow-postgres
          property: connectionString

      # Authentication Secrets (cryptographically generated by Render)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      # AI Provider Configuration (Google Gemini unmocked streaming)
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-3.5-flash
      - key: AI_API_KEY
        sync: false

      # Network Security & Reverse Proxy URLs
      - key: CORS_ORIGIN
        sync: false
      - key: APP_PUBLIC_URL
        sync: false

      # Production Rate Limiting (express-rate-limit)
      - key: RATE_LIMIT_MAX_AUTH
        value: "100"
      - key: RATE_LIMIT_MAX_UNAUTH
        value: "20"
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"

      # Automation Business Layer (Invoicing & Lead Notifications)
      - key: LEAD_NOTIFICATION_EMAIL
        sync: false
      - key: COMPANY_ADDRESS
        value: "Hyderabad, India"
      - key: COMPANY_GST
        sync: false
      - key: BANK_DETAILS
        sync: false

  # ----------------------------------------------------------------------------
  # 2. EduFlow Frontend Static Site (React 18 + Vite SPA)
  # High-performance static web app with Observation Mode & Officer Workbenches
  # ----------------------------------------------------------------------------
  - type: web
    name: eduflow-web
    runtime: static
    rootDir: eduflow-core/web
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Connects frontend to the deployed backend API (e.g. https://eduflow-backend.onrender.com/api/v1)
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_DEMO_MODE
        value: "true"

# ------------------------------------------------------------------------------
# 3. Managed PostgreSQL Database (Render Postgres)
# Persistent relational storage for users, sessions, leads, reports, and invoices
# ------------------------------------------------------------------------------
databases:
  - name: eduflow-postgres
    plan: starter
    region: singapore
    databaseName: eduflow
    user: eduflow
